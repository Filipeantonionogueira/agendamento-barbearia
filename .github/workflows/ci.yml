name: CI

# Qualquer etapa que falhar impede a publicacao.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (testes + seguranca)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # Banco real para os testes de integracao.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: barbearia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/barbearia_test?schema=public
      # Segredos descartaveis apenas para a suite de testes.
      JWT_ACCESS_SECRET: ci-access-secret-com-mais-de-32-caracteres-000000
      JWT_REFRESH_SECRET: ci-refresh-secret-com-mais-de-32-caracteres-00000
      FRONTEND_ORIGIN: http://localhost:5173
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Gerar Prisma Client
        run: npx prisma generate

      - name: Validar schema do Prisma
        run: npx prisma validate

      - name: Aplicar migracoes no banco de teste
        run: npx prisma migrate deploy

      - name: Popular dados iniciais
        run: npx prisma db seed

      - name: Testes automatizados (unitarios + integracao)
        run: npm test

      - name: Auditoria de dependencias
        run: npm audit --audit-level=high

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Build de producao
        run: npm run build

      - name: Auditoria de dependencias
        run: npm audit --audit-level=high

      - name: Publicar artefato do build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  seguranca:
    name: Verificacao de segredos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Garantir que segredos e dados nao foram versionados
        run: |
          set -e
          echo "Verificando arquivos sensiveis no repositorio..."
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo "::error::Arquivo .env versionado. Remova do controle de versao."
            exit 1
          fi
          if git ls-files | grep -E '\.postgres-data'; then
            echo "::error::Dados do PostgreSQL versionados. Remova do controle de versao."
            exit 1
          fi
          echo "OK: nenhum arquivo sensivel versionado."
